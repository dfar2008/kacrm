# 应收 / Receivable — backed by receivables table.
# View `v_dashboard_receivables` normalizes receivables_id -> id, owner_by
# -> owner_user_id, receivablesstatus -> status, and extracts JSONB amounts
# (dueamount, actualamount, balance) into numeric columns.
entity: receivable
source_view: v_dashboard_receivables

row_filter:
  self: "owner_user_id = :caller_id"
  team: "owner_user_id IN (SELECT id FROM v_team_members(:caller_id))"
  org:  "1=1"

dimensions:
  - {name: status, type: string}
  - {name: owner_user_id, type: ref, references: user}
  - {name: department_id, type: ref, references: department}
  - {name: accounts_id, type: ref, references: customer}
  - {name: duedate, type: time, granularities: [day, week, month, quarter, year]}
  - {name: actualdate, type: time, granularities: [day, week, month, quarter, year]}
  - {name: created_at, type: time, granularities: [day, week, month, quarter, year]}

measures:
  - {name: count, type: count}
  - {name: total_due, type: sum, sql: due_amount, requires_grant: see_revenue}
  - {name: total_actual, type: sum, sql: actual_amount, requires_grant: see_revenue}
  - {name: total_balance, type: sum, sql: balance, requires_grant: see_revenue}
  - {name: overdue_count, type: count, where: "duedate < CURRENT_DATE AND (actual_amount IS NULL OR actual_amount < due_amount)"}

detail_columns:
  default: [id, name, status, due_amount, actual_amount, accounts_id, owner_user_id, duedate]
  optional: [balance, actualdate, salesorders_id, department_id, created_at]
