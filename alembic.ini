[alembic]
# Path to migration scripts.
script_location = alembic

# Database URL is resolved inside env.py from the CRM_DATABASE_URL / HERMES_CRM_DATABASE_URL env var.
# A fallback is hard-coded for local dev so alembic commands work out of the box.
sqlalchemy.url =

# File naming: "0001_golden_schema.py" rather than "<hash>_<slug>.py".
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

# Timezone for created_at in migration files.
timezone = UTC


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
