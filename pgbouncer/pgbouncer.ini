;; hermes-cloud — pgbouncer transaction-pooling proxy.
;;
;; Why this exists: hermes/crm/db.py:get_pool builds a per-process psycopg
;; connection pool. The cloud web server, each celery worker, and every
;; per-profile hermes subprocess each open one — so total PostgreSQL
;; connections scale linearly with profile count. At a few dozen active
;; profiles a fixed pool ceiling would blow past PG's max_connections.
;;
;; pgbouncer sits between them: app processes hold cheap client
;; connections here, and pgbouncer multiplexes them onto a small fixed
;; set of real PG backends, assigned per-transaction.
;;
;; Wiring:
;;   .env   HERMES_CRM_DATABASE_URL → 127.0.0.1:6432 (this proxy)
;;   .env   ALEMBIC_DATABASE_URL    → 127.0.0.1:5432 (direct; DDL needs it)
;;   supervised by scripts/run_cloud_supervised.sh

[databases]
;; Alias name must equal the dbname the app connects with. host/port
;; target the real PostgreSQL backend.
hermes_crm_dev = host=127.0.0.1 port=5432 dbname=hermes_crm_dev

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432

;; Transaction pooling: a real backend is bound to a client only for the
;; duration of a transaction, then returned to the pool. This is what
;; lets dozens of mostly-idle profile subprocesses share a handful of PG
;; backends. psycopg3 server-side prepared statements are disabled
;; application-side (prepare_threshold=None in hermes/crm/db.py) because
;; they do not survive per-transaction backend reassignment.
pool_mode = transaction

;; Local-dev auth: the PostgreSQL cluster trusts the local unix user
;; without a password, so the proxy does the same for its clients.
;; Production must switch to scram-sha-256 with a real secret userlist.
auth_type = trust
auth_file = pgbouncer/userlist.txt

;; Real PG backends per (user, database) pair. The whole point of the
;; proxy: hundreds of app-side client connections multiplex onto this
;; many actual PG connections. 25 + reserve 5 stays far under PG's
;; max_connections (100), leaving headroom for direct alembic/admin use.
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

;; Accept many client connections — every subprocess pool lands here,
;; but idle clients cost almost nothing (no backend bound).
max_client_conn = 1000

;; Recycle backends idle longer than 10 min so PG isn't pinned to peak.
server_idle_timeout = 600

;; Allow `psql -p 6432 pgbouncer -c 'SHOW POOLS'` for diagnostics.
admin_users = openclaw
stats_users = openclaw
