version: "3.9"

# =============================================================================
# Hermes Development Overrides
# =============================================================================
# Use SQLite instead of PostgreSQL, mount source for hot reload, and expose
# all service ports directly on localhost.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# =============================================================================

services:

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    # Override command to enable hot reload via uvicorn --reload
    command:
      - uvicorn
      - hermes_cloud.app.dev_server:app
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --reload
    ports:
      - "8080:8080"
    environment:
      # Use a persistent on-disk SQLite database for dev — no Postgres needed.
      HERMES_CLOUD_DB_URL: "sqlite+pysqlite:///./hermes_cloud_dev.db"
      # Disable Redis requirement; rate limiting falls back to in-process.
      HERMES_CLOUD_REDIS_URL: ""
      # WeChat Pay auto-approve so you can test billing flows without real payments.
      DEV_WECHAT_AUTO_PAY: "true"
      # Easy dev credentials — override in your shell or .env for security.
      HERMES_CLOUD_ADMIN_KEY: "${HERMES_CLOUD_ADMIN_KEY:-admin-key}"
      HERMES_CLOUD_SESSION_COOKIE_SECRET: "${HERMES_CLOUD_SESSION_COOKIE_SECRET:-dev-cookie-secret-32chars}"
      # No billing requirement in dev by default.
      HERMES_CLOUD_BILLING_REQUIRED: "false"
      # Worker endpoints point to locally exposed ports.
      HERMES_CLOUD_WORKER_ENDPOINTS: "http://worker-1:8101,http://worker-2:8102,http://worker-3:8103"
      HERMES_CLOUD_WORKER_INTERNAL_KEY: "${HERMES_INTERNAL_KEY:-dev-internal-key}"
    volumes:
      # Mount source code for hot reload — edits are reflected immediately.
      - ./hermes_cloud:/app/hermes_cloud:rw
      - ./gateway:/app/gateway:rw
      - ./agent:/app/agent:rw
      - ./tools:/app/tools:rw
      - ./skills:/app/skills:rw
      # Persist the dev SQLite database across restarts.
      - ./hermes_cloud_dev.db:/app/hermes_cloud_dev.db
    depends_on: []  # Remove postgres/redis dependency in dev

  worker-1:
    ports:
      - "8101:8101"
    environment:
      HERMES_INTERNAL_KEY: "${HERMES_INTERNAL_KEY:-dev-internal-key}"
    volumes:
      - ./gateway:/app/gateway:rw
      - ./agent:/app/agent:rw
      - ./tools:/app/tools:rw
      - ./skills:/app/skills:rw

  worker-2:
    ports:
      - "8102:8102"
    environment:
      HERMES_INTERNAL_KEY: "${HERMES_INTERNAL_KEY:-dev-internal-key}"
    volumes:
      - ./gateway:/app/gateway:rw
      - ./agent:/app/agent:rw
      - ./tools:/app/tools:rw
      - ./skills:/app/skills:rw

  worker-3:
    ports:
      - "8103:8103"
    environment:
      HERMES_INTERNAL_KEY: "${HERMES_INTERNAL_KEY:-dev-internal-key}"
    volumes:
      - ./gateway:/app/gateway:rw
      - ./agent:/app/agent:rw
      - ./tools:/app/tools:rw
      - ./skills:/app/skills:rw

  nginx:
    ports:
      - "8090:80"  # Expose on 8090 to avoid conflict with local nginx/system port 80
    # No TLS in dev — plain HTTP only.
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro

  # Disable postgres and redis entirely in dev (SQLite + in-process RL).
  postgres:
    profiles: ["disabled"]

  redis:
    profiles: ["disabled"]
