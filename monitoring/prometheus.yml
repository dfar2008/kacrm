global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # configure your alertmanager here

scrape_configs:
  - job_name: "hermes-cloud"
    static_configs:
      - targets: ["orchestrator:8080"]
    metrics_path: /metrics
