version: "3.9"

# =============================================================================
# Hermes Production Stack
# =============================================================================
# Services:
#   orchestrator  — hermes-cloud FastAPI app (OpenAI-compatible gateway + billing)
#   worker-{1-3}  — hermes-agent API server instances (sandbox execution)
#   postgres      — PostgreSQL 15 (persistent database)
#   redis         — Redis 7 (distributed rate limiting + usage tracking)
#   nginx         — Reverse proxy (TLS termination, routing)
#
# Usage:
#   cp .env.example .env && nano .env
#   docker compose up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Orchestrator — hermes-cloud FastAPI application
  # ---------------------------------------------------------------------------
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    image: hermes-cloud:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Service identity
      HERMES_CLOUD_SERVICE_NAME: "${HERMES_CLOUD_SERVICE_NAME:-hermes-cloud}"
      HERMES_CLOUD_MODEL_NAME: "${HERMES_CLOUD_MODEL_NAME:-hermes-agent}"
      # Authentication
      HERMES_CLOUD_ADMIN_KEY: "${HERMES_CLOUD_ADMIN_KEY}"
      HERMES_CLOUD_SESSION_COOKIE_SECRET: "${HERMES_CLOUD_SESSION_COOKIE_SECRET}"
      # Database
      HERMES_CLOUD_DB_URL: "${HERMES_CLOUD_DB_URL:-postgresql+psycopg2://hermes:${POSTGRES_PASSWORD:-changeme}@postgres:5432/hermes_cloud}"
      # Worker pool
      HERMES_CLOUD_WORKER_ENDPOINTS: "${HERMES_CLOUD_WORKER_ENDPOINTS:-http://worker-1:8101,http://worker-2:8102,http://worker-3:8103}"
      HERMES_CLOUD_WORKER_INTERNAL_KEY: "${HERMES_CLOUD_WORKER_INTERNAL_KEY}"
      # Rate limiting
      HERMES_CLOUD_REDIS_URL: "${HERMES_CLOUD_REDIS_URL:-redis://redis:6379/0}"
      # Billing
      HERMES_CLOUD_BILLING_REQUIRED: "${HERMES_CLOUD_BILLING_REQUIRED:-true}"
      HERMES_CLOUD_WECHAT_CALLBACK_SECRET: "${HERMES_CLOUD_WECHAT_CALLBACK_SECRET:-}"
      # WeChat Pay
      WECHAT_MCH_ID: "${WECHAT_MCH_ID:-}"
      WECHAT_APP_ID: "${WECHAT_APP_ID:-}"
      WECHAT_API_V3_KEY: "${WECHAT_API_V3_KEY:-}"
      WECHAT_PRIVATE_KEY_PATH: "${WECHAT_PRIVATE_KEY_PATH:-/run/secrets/wechat_private_key.pem}"
      WECHAT_CERT_SERIAL_NO: "${WECHAT_CERT_SERIAL_NO:-}"
      WECHAT_NOTIFY_URL: "${WECHAT_NOTIFY_URL:-}"
      PYTHONUNBUFFERED: "1"
    expose:
      - "8080"
    volumes:
      - orchestrator_data:/home/hermes/.hermes
    networks:
      - internal
      - frontend

  # ---------------------------------------------------------------------------
  # Workers — hermes-agent API server instances
  # ---------------------------------------------------------------------------
  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-agent:latest
    restart: unless-stopped
    environment:
      HERMES_INTERNAL_KEY: "${HERMES_INTERNAL_KEY}"
      HERMES_WORKERS: "${HERMES_WORKERS:-4}"
      HERMES_PORT: "8101"
      # LLM provider
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      PYTHONUNBUFFERED: "1"
    expose:
      - "8101"
    volumes:
      - worker1_data:/opt/data
    networks:
      - internal
    command: ["hermes", "gateway", "--platform", "api_server", "--port", "8101"]

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-agent:latest
    restart: unless-stopped
    environment:
      HERMES_INTERNAL_KEY: "${HERMES_INTERNAL_KEY}"
      HERMES_WORKERS: "${HERMES_WORKERS:-4}"
      HERMES_PORT: "8102"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      PYTHONUNBUFFERED: "1"
    expose:
      - "8102"
    volumes:
      - worker2_data:/opt/data
    networks:
      - internal
    command: ["hermes", "gateway", "--platform", "api_server", "--port", "8102"]

  worker-3:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-agent:latest
    restart: unless-stopped
    environment:
      HERMES_INTERNAL_KEY: "${HERMES_INTERNAL_KEY}"
      HERMES_WORKERS: "${HERMES_WORKERS:-4}"
      HERMES_PORT: "8103"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      PYTHONUNBUFFERED: "1"
    expose:
      - "8103"
    volumes:
      - worker3_data:/opt/data
    networks:
      - internal
    command: ["hermes", "gateway", "--platform", "api_server", "--port", "8103"]

  # ---------------------------------------------------------------------------
  # PostgreSQL — primary datastore
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hermes_cloud
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis — distributed rate limiting and session caching
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Nginx — TLS termination and reverse proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      - orchestrator
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend

# =============================================================================
# Networks
# =============================================================================
networks:
  # internal: service-to-service only, not exposed to host
  internal:
    driver: bridge
    internal: true
  # frontend: nginx ↔ orchestrator; exposed to internet via nginx ports
  frontend:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  orchestrator_data:
    driver: local
  worker1_data:
    driver: local
  worker2_data:
    driver: local
  worker3_data:
    driver: local
  nginx_certs:
    driver: local
  nginx_logs:
    driver: local
