# =============================================================================
# Hermes Production Nginx Configuration
# =============================================================================
# Handles:
#   - HTTPS on port 443 (TLS — configure cert paths below)
#   - HTTP on port 80 (permanent redirect to HTTPS)
#   - Reverse proxy to hermes-cloud orchestrator
#   - SSE streaming (proxy_buffering off)
#   - Nginx-level rate limiting (backup to app-level limiting)
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time ut=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens off;  # Don't leak nginx version

    # -------------------------------------------------------------------------
    # Gzip compression (not for SSE streams — those disable buffering)
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # -------------------------------------------------------------------------
    # Rate limiting zone — nginx-level backup to app-level rate limiting.
    # Limits by $binary_remote_addr (4 bytes per entry, efficient).
    # 10m zone = ~160,000 unique IPs stored.
    # 30r/m = 1 request every 2 seconds sustained; burst allows short spikes.
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_status 429;

    # -------------------------------------------------------------------------
    # Upstream: hermes-cloud orchestrator
    # -------------------------------------------------------------------------
    upstream hermes_cloud {
        server orchestrator:8080;
        # Add more orchestrator instances here for horizontal scaling:
        # server orchestrator-2:8080;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt ACME challenges through without redirecting.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS server
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name _;  # Replace with your domain, e.g.: your-domain.com

        # -- TLS configuration -----------------------------------------------
        # Obtain certificates with certbot (see docs/deployment.md).
        # Uncomment and adjust these paths after running certbot:
        #
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        #
        # Modern TLS settings (Mozilla Intermediate compatibility):
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:...;
        # ssl_prefer_server_ciphers off;
        # ssl_session_timeout 1d;
        # ssl_session_cache shared:SSL:10m;
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # add_header Strict-Transport-Security "max-age=63072000" always;
        # --------------------------------------------------------------------

        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Proxy common headers — set once, apply to all location blocks.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # Required for keep-alive connections to upstream.
        proxy_set_header Connection "";

        # Default timeouts (overridden per-location for long-running requests).
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # ----------------------------------------------------------------
        # /v1/chat/completions — OpenAI-compatible completions endpoint.
        # Long timeout (300 s) to accommodate streaming and multi-step
        # agentic responses.
        # ----------------------------------------------------------------
        location /v1/chat/completions {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://hermes_cloud;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # SSE streaming: disable buffering so tokens reach the client
            # as they are produced rather than being batched.
            proxy_buffering    off;
            proxy_cache        off;
            # X-Accel-Buffering header from upstream can also disable buffering.
            proxy_set_header   X-Accel-Buffering no;
        }

        # ----------------------------------------------------------------
        # /v1/models — model listing (fast, no special timeouts needed).
        # ----------------------------------------------------------------
        location /v1/models {
            proxy_pass http://hermes_cloud;
        }

        # ----------------------------------------------------------------
        # /v1/responses — not implemented; return 404 at nginx level to
        # avoid unnecessary proxying overhead.
        # ----------------------------------------------------------------
        location /v1/responses {
            return 404 '{"error":{"message":"Not implemented","type":"invalid_request_error","code":"not_implemented"}}';
            add_header Content-Type application/json always;
        }

        # ----------------------------------------------------------------
        # /v1/runs — structured event streaming (long-lived SSE).
        # ----------------------------------------------------------------
        location /v1/runs {
            limit_req zone=api_limit burst=5 nodelay;

            proxy_pass http://hermes_cloud;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_set_header   X-Accel-Buffering no;
        }

        # ----------------------------------------------------------------
        # /dashboard — web UI for admin and users.
        # ----------------------------------------------------------------
        location /dashboard {
            proxy_pass http://hermes_cloud;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------------
        # Dashboard AI-assistant chat — Server-Sent Events.
        # Long timeout for reasoning models (thinking phase can run
        # minutes) + no buffering so heartbeat/op frames reach the
        # browser live. Regex location takes priority over /api/ below.
        # ----------------------------------------------------------------
        location ~ ^/api/dashboards/tabs/[^/]+/messages$ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://hermes_cloud;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            proxy_buffering    off;
            proxy_cache        off;
            proxy_set_header   X-Accel-Buffering no;
        }

        # ----------------------------------------------------------------
        # /api/ — REST API endpoints (billing, user management, etc.).
        # ----------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://hermes_cloud;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------------
        # /health — liveness probe; do not rate-limit (used by load
        # balancers and monitoring systems at high frequency).
        # ----------------------------------------------------------------
        location /health {
            proxy_pass http://hermes_cloud;
            proxy_read_timeout 5s;
            access_log off;
        }

        # ----------------------------------------------------------------
        # /static/ — served by the FastAPI app (or replace with direct
        # nginx static file serving for better performance).
        # ----------------------------------------------------------------
        location /static/ {
            proxy_pass http://hermes_cloud;
            proxy_read_timeout 30s;
            # Cache static assets at nginx level.
            proxy_cache_valid 200 1d;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # ----------------------------------------------------------------
        # Catch-all: proxy everything else to hermes_cloud.
        # ----------------------------------------------------------------
        location / {
            proxy_pass http://hermes_cloud;
            proxy_read_timeout 60s;
        }
    }
}
