# 收款 / Payment — backed by payments table.
# View `v_dashboard_payments` normalizes payments_id -> id, payments_name
# -> name, owner_by -> owner_user_id, and extracts JSONB payamount -> amount.
entity: payment
source_view: v_dashboard_payments

row_filter:
  self: "owner_user_id = :caller_id"
  team: "owner_user_id IN (SELECT id FROM v_team_members(:caller_id))"
  org:  "1=1"

dimensions:
  - {name: owner_user_id, type: ref, references: user}
  - {name: department_id, type: ref, references: department}
  - {name: receivables_id, type: ref, references: receivable}
  - {name: paydate, type: time, granularities: [day, week, month, quarter, year]}
  - {name: created_at, type: time, granularities: [day, week, month, quarter, year]}

measures:
  - {name: count, type: count}
  - {name: total_amount, type: sum, sql: amount, requires_grant: see_revenue}
  - {name: avg_amount, type: avg, sql: amount, requires_grant: see_revenue}

detail_columns:
  default: [id, name, amount, owner_user_id, paydate]
  optional: [receivables_id, department_id, remark, created_at]
