# =============================================================================
# Hermes Development Nginx Configuration (HTTP only, no TLS)
# =============================================================================
# Used by docker-compose.dev.yml for local development.
# Exposes the orchestrator on port 80 (mapped to 8090 on the host).
# =============================================================================

worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr "$request" $status rt=$request_time';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;

    upstream hermes_cloud {
        server orchestrator:8080;
        keepalive 8;
    }

    server {
        listen 80;
        server_name localhost;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE / streaming endpoints
        location /v1/chat/completions {
            proxy_pass http://hermes_cloud;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
        }

        location /v1/runs {
            proxy_pass http://hermes_cloud;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
        }

        # Dashboard AI-assistant chat — SSE; long timeout for reasoning
        # models + no buffering so heartbeat/op frames stream live.
        location ~ ^/api/dashboards/tabs/[^/]+/messages$ {
            proxy_pass http://hermes_cloud;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
        }

        # Everything else
        location / {
            proxy_pass http://hermes_cloud;
            proxy_read_timeout 60s;
        }
    }
}
